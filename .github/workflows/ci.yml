name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rust-test:
    name: Desktop App (Rust tests & check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        run: cargo test --lib
      - name: Check build
        run: cargo check

  plugins-build:
    name: Server Plugins (Java 21 + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KaizerMultiBar
        working-directory: plugins/KaizerMultiBar
        run: mvn -B clean package
      - name: Build KaizerUI
        working-directory: plugins/KaizerUI
        run: mvn -B clean package

  mcp-test:
    name: GUI Studio MCP Server (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run MCP server E2E tests
        run: node mcp-server/test.mjs
