name: Announce Release on Discord

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (e.g. v1.0.2 or latest)"
        required: false
        default: "latest"
        type: string
      mention:
        description: "Optional mention (e.g. @everyone or <@&ROLE_ID>)"
        required: false
        default: ""
        type: string
      note:
        description: "Optional extra highlight note (TH / EN)"
        required: false
        default: ""
        type: string

jobs:
  announce:
    name: Post Discord Embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send Discord Embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISCORD_MENTION: ${{ inputs.mention || vars.DISCORD_MENTION }}
          EXTRA_NOTE: ${{ inputs.note }}
        run: node .github/scripts/notify-discord.mjs
