name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release
      - name: Upload desktop binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaizerhud-windows
          path: src-tauri/target/release/kaizerhud.exe

  build-plugins:
    name: Build Server Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KaizerMultiBar
        working-directory: plugins/KaizerMultiBar
        run: mvn -B clean package
      - name: Build KaizerMultiBarGeyser
        working-directory: plugins/KaizerMultiBarGeyser
        run: mvn -B clean package
      - name: Build KaizerUI
        working-directory: plugins/KaizerUI
        run: mvn -B clean package
      - name: Collect plugin jars
        run: |
          mkdir -p dist-plugins
          cp plugins/KaizerMultiBar/target/KaizerMultiBar-*.jar dist-plugins/
          cp plugins/KaizerMultiBarGeyser/target/KaizerMultiBarGeyser-*.jar dist-plugins/
          cp plugins/KaizerUI/target/KaizerUI-*.jar dist-plugins/
          rm -f dist-plugins/original-*.jar
          ls -la dist-plugins/
      - name: Upload plugin jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaizer-plugins
          path: dist-plugins/*.jar

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/kaizerhud-windows/kaizerhud.exe
            dist/kaizer-plugins/**/*.jar
