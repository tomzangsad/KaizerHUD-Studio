name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -match '^\d+\.\d+\.\d+$') {
            $confPath = "src-tauri/tauri.conf.json"
            $conf = Get-Content $confPath -Raw -Encoding UTF8
            $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
            [System.IO.File]::WriteAllText((Resolve-Path $confPath), $conf, [System.Text.UTF8Encoding]::new($false))

            $cargoPath = "src-tauri/Cargo.toml"
            $cargo = Get-Content $cargoPath -Raw -Encoding UTF8
            $cargo = [regex]::Replace($cargo, '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"", 1)
            [System.IO.File]::WriteAllText((Resolve-Path $cargoPath), $cargo, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Synced app version to $ver"
          }
      - name: Build release installer and binary
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop | Out-Null
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setupFiles = Get-ChildItem "$nsisDir/*-setup.exe"
          if (-not $setupFiles) { throw "NSIS setup executable not found" }
          foreach ($f in Get-ChildItem "$nsisDir/*" -File | Where-Object { $_.Name -match '(-setup\.exe(\.sig)?|\.nsis\.zip(\.sig)?)$' }) {
            $cleanName = $f.Name -replace ' ', '-'
            Copy-Item $f.FullName "dist-desktop/$cleanName"
          }
          Copy-Item "src-tauri/target/release/kaizerhud.exe" "dist-desktop/kz-kaizerhud-portable.exe"
          Get-ChildItem dist-desktop
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaizerhud-windows
          path: dist-desktop/*

  build-desktop-linux:
    name: Build Linux Desktop App (.AppImage & .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const ver = (process.env.TAG_NAME || "").replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(ver)) process.exit(0);
            const conf = fs.readFileSync("src-tauri/tauri.conf.json", "utf8")
              .replace(/"version"\s*:\s*"[^"]+"/, `"version": "${ver}"`);
            fs.writeFileSync("src-tauri/tauri.conf.json", conf, "utf8");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8")
              .replace(/^version\s*=\s*"[^"]+"/m, `version = "${ver}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo, "utf8");
            console.log("Synced app version to " + ver);
          '
      - name: Build AppImage and deb
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb
      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-linux
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/appimage/*.AppImage* src-tauri/target/release/bundle/deb/*.deb; do
            base="$(basename "$f")"
            clean="${base// /-}"
            cp "$f" "dist-linux/$clean"
          done
          if ! ls dist-linux/*.AppImage >/dev/null 2>&1; then
            echo "AppImage bundle not found!" >&2
            exit 1
          fi
          ls -la dist-linux/
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaizerhud-linux
          path: dist-linux/*

  build-plugins:
    name: Build Server Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KaizerMultiBar
        working-directory: plugins/KaizerMultiBar
        run: mvn -B clean package
      - name: Build KaizerUI
        working-directory: plugins/KaizerUI
        run: mvn -B clean package
      - name: Collect plugin jars
        run: |
          mkdir -p dist-plugins
          cp plugins/KaizerMultiBar/target/KaizerMultiBar-*.jar dist-plugins/
          cp plugins/KaizerUI/target/KaizerUI-*.jar dist-plugins/
          rm -f dist-plugins/original-*.jar
          ls -la dist-plugins/
      - name: Upload plugin jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaizer-plugins
          path: dist-plugins/*.jar

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-desktop-linux, build-plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate unified updater manifest (latest.json)
        env:
          DIST_DIR: dist
          OUT_FILE: dist/latest.json
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/gen-updater-json.mjs
      - name: Remove standalone .sig after embedding in latest.json
        run: find dist -type f -name '*.sig' -delete
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUT_FILE: release-body.md
        run: node .github/scripts/prepare-release-notes.mjs
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release-body.md
          files: |
            dist/kaizerhud-windows/*
            dist/kaizerhud-linux/*
            dist/latest.json
            dist/kaizer-plugins/**/*.jar
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '<@&1298176398069858314>' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/notify-discord.mjs
