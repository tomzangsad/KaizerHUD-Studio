name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -match '^\d+\.\d+\.\d+$') {
            $confPath = "src-tauri/tauri.conf.json"
            $conf = Get-Content $confPath -Raw -Encoding UTF8
            $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
            [System.IO.File]::WriteAllText((Resolve-Path $confPath), $conf, [System.Text.UTF8Encoding]::new($false))

            $cargoPath = "src-tauri/Cargo.toml"
            $cargo = Get-Content $cargoPath -Raw -Encoding UTF8
            $cargo = [regex]::Replace($cargo, '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"", 1)
            [System.IO.File]::WriteAllText((Resolve-Path $cargoPath), $cargo, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Synced app version to $ver"
          }
      - name: Build release installer and binary
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-desktop | Out-Null
          $setupFiles = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if (-not $setupFiles) { throw "NSIS setup executable not found" }
          foreach ($f in $setupFiles) {
            $cleanName = $f.Name -replace ' ', '-'
            Copy-Item $f.FullName "dist-desktop/$cleanName"
          }
          Copy-Item "src-tauri/target/release/kaizerhud.exe" "dist-desktop/kaizerhud-portable.exe"
          Get-ChildItem dist-desktop
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaizerhud-windows
          path: dist-desktop/*

  build-plugins:
    name: Build Server Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KaizerMultiBar
        working-directory: plugins/KaizerMultiBar
        run: mvn -B clean package
      - name: Build KaizerUI
        working-directory: plugins/KaizerUI
        run: mvn -B clean package
      - name: Collect plugin jars
        run: |
          mkdir -p dist-plugins
          cp plugins/KaizerMultiBar/target/KaizerMultiBar-*.jar dist-plugins/
          cp plugins/KaizerUI/target/KaizerUI-*.jar dist-plugins/
          rm -f dist-plugins/original-*.jar
          ls -la dist-plugins/
      - name: Upload plugin jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaizer-plugins
          path: dist-plugins/*.jar

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## What to Download / ไฟล์ไหนใช้ทำอะไร

            | File | English | ภาษาไทย |
            |---|---|---|
            | `KaizerHUD-Studio_*_x64-setup.exe` | **Windows Installer** *(recommended — adds Start Menu & Desktop shortcut)* | **ตัวติดตั้ง Windows** *(แนะนำ — สร้างไอคอนหน้า Desktop / Start Menu)* |
            | `kaizerhud-portable.exe` | **Portable Windows app** *(run directly without installing)* | **ตัวโปรแกรมแบบพกพา** *(เปิดใช้งานได้ทันที ไม่ต้องติดตั้ง)* |
            | `KaizerMultiBar-2.1.0.jar` | **HUD Studio server plugin** *(put in Paper/Purpur/Folia `plugins/`)* | **ปลั๊กอินสำหรับ HUD Studio** *(ใส่ใน `plugins/` บน Paper/Purpur/Folia 1.21.x–26.x)* |
            | `KaizerUI-1.0.0.jar` | **GUI Studio server plugin** *(optional — only if using cursor menus)* | **ปลั๊กอินสำหรับ GUI Studio** *(ลงเฉพาะเมื่อใช้เมนู GUI)* |

            > **Note:** `Source code (zip)` and `Source code (tar.gz)` are for developers only — see [docs/DEVELOPMENT.md](https://github.com/${{ github.repository }}/blob/main/docs/DEVELOPMENT.md).
            > **Docs / คู่มือ:** [User Guide (EN / TH)](https://github.com/${{ github.repository }}/blob/main/docs/USER_GUIDE.md) · [Plugin Setup (EN / TH)](https://github.com/${{ github.repository }}/blob/main/plugins/README.md) · [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ---
          files: |
            dist/kaizerhud-windows/*
            dist/kaizer-plugins/**/*.jar
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '<@&1298176398069858314>' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/notify-discord.mjs
