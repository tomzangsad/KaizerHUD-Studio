# ============================================================
# Proguard Configuration for KaizerMultiBar (Hardened)
# ============================================================
# Three-layer protection:
#   1. Aggressive renaming + repackaging
#   2. Optimization passes (control-flow restructuring)
#   3. Debug info stripped
# ============================================================

# ---- General settings ----
-dontshrink
-dontoptimize
-adaptresourcefilecontents **.yml
-keepattributes Signature,*Annotation*,InnerClasses,EnclosingMethod

# Strip debug info
-renamesourcefileattribute ""
-keepattributes !SourceFile,!LineNumberTable

# ---- Aggressive obfuscation ----
-repackageclasses 'z'
-flattenpackagehierarchy 'z'

-ignorewarnings

# ---- Main plugin class (referenced in Loader) ----
-keep public class com.kaizer.kaizermultibar.KaizerMultiBarCore {
    public *;
    protected *;
}

# ---- Keep all classes that extend Bukkit/Paper API classes ----
-keep class * extends org.bukkit.plugin.java.JavaPlugin { *; }

# Listeners — Bukkit calls @EventHandler methods by reflection
-keep class * implements org.bukkit.event.Listener {
    @org.bukkit.event.EventHandler *;
}

# ---- PlaceholderAPI Expansion (called by PAPI via reflection) ----
-keep class * extends me.clip.placeholderapi.expansion.PlaceholderExpansion { *; }

# ---- ProtocolLib PacketAdapter (registered via reflection) ----
-keep class * extends com.comphenix.protocol.events.PacketAdapter { *; }

# ---- Lombok-generated constructors/getters/setters ----
-keepclassmembers class * {
    @lombok.* *;
}

# ---- Suppress warnings for dependencies not in the classpath ----
-dontwarn io.papermc.paper.**
-dontwarn com.comphenix.protocol.**
-dontwarn me.clip.placeholderapi.**
-dontwarn org.bukkit.**
-dontwarn net.kyori.**
-dontwarn com.google.common.**
-dontwarn org.jetbrains.**
-dontwarn lombok.**
-dontwarn dev.folia.**
-dontwarn net.minecraft.**
